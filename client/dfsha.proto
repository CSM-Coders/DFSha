syntax = "proto3";

package dfsha;

// Servicio expuesto por cada DataNode.
// Cliente -> DataNode: WriteBlock / ReadBlock / DeleteBlock
// ControlNode -> DataNode: Ping (chequeo de salud, opcional)
service DataNode {
  rpc WriteBlock (Block) returns (Ack);
  rpc ReadBlock (BlockId) returns (Block);
  rpc DeleteBlock (BlockId) returns (Ack);
  rpc Ping (Empty) returns (Ack);
}

message Block {
  string block_id = 1;
  bytes data = 2;
  string checksum = 3; // sha256 hex del contenido, para verificar integridad
}

message BlockId {
  string block_id = 1;
}

message Ack {
  bool success = 1;
  string message = 2;
}

message Empty {}
