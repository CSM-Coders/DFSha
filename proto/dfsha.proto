syntax = "proto3";

package dfsha;

// fuente única del protocolo grpc, se regenera con scripts/gen_proto.sh (copia dfsha_pb2*.py a client/, control_node/ y data_node/); cada datanode expone dos puertos: el público (tls) para cliente -> datanode con WriteBlock/ReadBlock y el interno (mtls) para control node -> datanode con DeleteBlock/ReplicateBlock/Ping y datanode -> datanode con ReadBlock (dentro de ReplicateBlock el destino jala el bloque de un origen sano); toda operación sobre un bloque exige un token de acceso (x-dfsha-token) firmado por el control node
service DataNode {
  rpc WriteBlock (Block) returns (Ack);
  rpc ReadBlock (BlockId) returns (Block);
  rpc DeleteBlock (BlockId) returns (Ack);
  // le ordena a este datanode copiar un bloque desde source_address (re-replicación)
  rpc ReplicateBlock (ReplicateRequest) returns (Ack);
  rpc Ping (Empty) returns (Ack);
}

message Block {
  string block_id = 1;
  bytes data = 2;
  string checksum = 3; // sha256 en hex del contenido
}

message BlockId {
  string block_id = 1;
}

message ReplicateRequest {
  string block_id = 1;
  string source_address = 2; // host:puerto (interno) del datanode que ya tiene el bloque
  string checksum = 3;       // sha256 esperado (de los metadatos), vacío = no verificar
  string source_node = 4;    // node_id que se espera en source_address (evita hablar con un nodo equivocado)
  string source_token = 5;   // token de lectura del bloque para el origen (lo da el control node)
}

message Ack {
  bool success = 1;
  string message = 2;
}

message Empty {}
